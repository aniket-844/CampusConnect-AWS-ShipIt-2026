AWSTemplateFormatVersion: '2010-09-09'
Description: Optional monthly AWS cost-budget email alert. Deploy only after entering your own email and approving the budget amount.
Parameters:
  AlertEmail:
    Type: String
    Description: Email address to receive AWS Budgets alerts.
    AllowedPattern: '.+@.+\..+'
  MonthlyBudgetUSD:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Monthly cost threshold in USD; adjust to your account and project.
Resources:
  CampusConnectBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub 'CampusConnect-monthly-${AWS::StackName}'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
